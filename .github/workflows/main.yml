name: Build Abri Market APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: mobile_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: mobile_flutter
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abri-market-apk
          path: mobile_flutter/build/app/outputs/flutter-apk/app-debug.apk
