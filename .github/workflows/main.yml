name: Build Abri Market APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e
          mkdir -p project
          unzip -q abri_market_apk_ready.zip -d project
          PROJECT_DIR=$(find project -name pubspec.yaml -type f -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abri-market-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
